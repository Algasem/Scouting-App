<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FRC 7476 Scouting</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
    <h1>FRC 7476 Spongebotics Scouting</h1> 
        
    <!-- Tabs -->
    <div class="tabs">
        <button class="tab active" onclick="switchMainTab('scouting')">Scouting</button>
        <button class="tab" onclick="switchMainTab('history')">History</button>
    </div>
    
    <!-- Scouting Tab -->
    <div id="scouting" class="tab-content active">
        <!-- Match Info -->
        <div class="section">
            <div class="form-group">
                <label>Match #</label>
                <input type="number" id="matchNumber" min="1">
            </div>
            <div class="form-group">
                <label>Team #</label>
                <input type="number" id="teamNumber" min="1">
            </div>
            <div class="form-group">
                <label>Scout Name</label>
                <input type="text" id="scoutName">
            </div>
        </div>
        
        <!-- Sub Tabs -->
        <div class="tabs">
            <button class="tab active" onclick="switchTab('pit')">Pit</button>
            <button class="tab" onclick="switchTab('auto')">Auto</button>
            <button class="tab" onclick="switchTab('teleop')">Teleop</button>
            <button class="tab" onclick="switchTab('endgame')">Endgame</button>
        </div>
        
        <!-- Pit Scouting -->
        <div id="pit" class="tab-content active">
            <div class="section">
                <h2>Pit Scouting</h2>
                
                <div class="form-group">
                    <label>Climb Level</label>
                    <select id="pitClimbLevel">
                        <option value="">Select...</option>
                        <option value="None">None</option>
                        <option value="Level 1">Level 1</option>
                        <option value="Level 2">Level 2</option>
                        <option value="Level 3">Level 3</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Height (inches)</label>
                    <input type="number" id="pitHeight" step="0.1">
                </div>
                
                <div class="form-group">
                    <label>Weight (lbs)</label>
                    <input type="number" id="pitWeight" step="0.1">
                </div>
                
                <div class="form-group">
                    <label>Intake Type</label>
                    <input type="text" id="pitIntake">
                </div>
                
                <div class="form-group">
                    <label>Drive Mechanism</label>
                    <select id="pitDriveMechanism">
                        <option value="">Select...</option>
                        <option value="Tank">Tank</option>
                        <option value="Swerve">Swerve</option>
                        <option value="Mecanum">Mecanum</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Strategy</label>
                    <textarea id="pitStrategy"></textarea>
                </div>
                
                <div class="form-group">
                    <label>Features</label>
                    <div class="checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="pitVision">
                            Vision
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="pitAdjustable">
                            Adjustable Scoring
                        </label>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Hopper Capacity</label>
                    <select id="pitHopperCapacity">
                        <option value="">Select...</option>
                        <option value="Fixed">Fixed</option>
                        <option value="Extendable">Extendable</option>
                        <option value="None">None</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Drive Experience</label>
                    <select id="pitDriveExperience">
                        <option value="">Select...</option>
                        <option value="Rookie">Rookie</option>
                        <option value="Intermediate">Intermediate</option>
                        <option value="Advanced">Advanced</option>
                        <option value="Expert">Expert</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Estimated Cycles</label>
                    <input type="number" id="pitEstimatedCycles" min="0">
                </div>
                
                <div class="form-group">
                    <label>Conversion %</label>
                    <input type="number" id="pitConversionPercent" min="0" max="100">
                </div>
                
                <div class="form-group">
                    <label>Launch Rate (fuel/sec)</label>
                    <input type="number" id="pitLaunchRate" step="0.1">
                </div>
                
                <div class="form-group">
                    <label>Build Quality (1-10)</label>
                    <input type="number" id="pitDurability" min="1" max="10">
                </div>
                
                <div class="form-group">
                    <label>Outside Perimeter</label>
                    <textarea id="pitOutsidePerimeter"></textarea>
                </div>
                
                <div class="form-group">
                    <label>Breakdowns</label>
                    <textarea id="pitBreakdowns"></textarea>
                </div>
                
                <div class="form-group">
                    <label>Human Player Notes</label>
                    <textarea id="pitHumanPlayer"></textarea>
                </div>
                
                <div class="form-group">
                    <label>Notes</label>
                    <textarea id="pitNotes"></textarea>
                </div>
            </div>
        </div>
        
        <!-- Auto -->
        <div id="auto" class="tab-content">
            <div class="section">
                <h2>Auto</h2>
                
                <div class="form-group">
                    <label>Climb Level</label>
                    <select id="autoClimbLevel">
                        <option value="None">None</option>
                        <option value="Level 1">Level 1</option>
                        <option value="Level 2">Level 2</option>
                        <option value="Level 3">Level 3</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Climb Speed</label>
                    <select id="autoClimbSpeed">
                        <option value="N/A">N/A</option>
                        <option value="Slow">Slow</option>
                        <option value="Medium">Medium</option>
                        <option value="Fast">Fast</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <div class="counter">
                        <span class="counter-label">Fuel Scored</span>
                        <button class="counter-btn" onclick="decrement5('autoFuelScored')">-5</button>
                        <button class="counter-btn" onclick="decrement('autoFuelScored')">-</button>
                        <span class="counter-value" id="autoFuelScored">0</span>
                        <button class="counter-btn" onclick="increment('autoFuelScored')">+</button>
                        <button class="counter-btn" onclick="increment5('autoFuelScored')">+5</button>

                    </div>
                </div>
                <div class="form-group">
                    <div class="counter">
                        <span class="counter-label">Fuel Missed</span>
                        <button class="counter-btn" onclick="decrement5('autoFuelMissed')">-5</button>
                        <button class="counter-btn" onclick="decrement('autoFuelMissed')">-</button>
                        <span class="counter-value" id="autoFuelMissed">0</span>
                        <button class="counter-btn" onclick="increment('autoFuelMissed')">+</button>
                        <button class="counter-btn" onclick="increment5('autoFuelMissed')">+5</button>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="autoBallsCollected">
                        Balls Collected to Our Side
                    </label>
                </div>
                
                <div class="form-group">
                    <label>Notes</label>
                    <textarea id="autoNotes"></textarea>
                </div>
            </div>
        </div>
        
        <!-- Teleop -->
        <div id="teleop" class="tab-content">
            <div class="section">
                <h2>Teleop</h2>
                
                <div class="form-group">
                    <div class="counter">
                        <span class="counter-label">Fuel Scored</span>
                        <button class="counter-btn" onclick="decrement5('teleopFuelScored')">-5</button>
                        <button class="counter-btn" onclick="decrement('teleopFuelScored')">-</button>
                        <span class="counter-value" id="teleopFuelScored">0</span>
                        <button class="counter-btn" onclick="increment('teleopFuelScored')">+</button>
                        <button class="counter-btn" onclick="increment5('teleopFuelScored')">+5</button>
                    </div>
                </div>
                
                <div class="form-group">
                    <div class="counter">
                        <span class="counter-label">Fuel Missed</span>
                        <button class="counter-btn" onclick="decrement5('teleopFuelMissed')">-5</button>
                        <button class="counter-btn" onclick="decrement('teleopFuelMissed')">-</button>
                        <span class="counter-value" id="teleopFuelMissed">0</span>
                        <button class="counter-btn" onclick="increment('teleopFuelMissed')">+</button>
                        <button class="counter-btn" onclick="increment5('teleopFuelMissed')">+5</button>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Traversal Time (sec)</label>
                    <input type="number" id="teleopTraversalTime" step="0.1">
                </div>

                <div class="form-group">
                    <label>Traversal</label>
                    <div class="checkbox-group">
                        <label class="checkbox-label">
                            <input type="radio" name = "traversal" id="Bump" value="yes">
                            Bump
                        </label>
                        <label class="checkbox-label">
                            <input type="radio" name = "traversal" id="Trench" value="no">
                            Trench
                        </label>
                        <label class="checkbox-label">
                            <input type="radio" name = "traversal" id="Both" value = "both">
                            Both
                        </label>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Active Phase Role</label>
                    <div class="checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="activeRoleFunnel">
                            Funnel to Teammates
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="activeRoleScoring">
                            Scoring
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="activeRoleFeed">
                            Feed Human Station
                        </label>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Inactive Phase Role</label>
                    <div class="checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="inactiveRoleLimit">
                            Limiting Balls
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="inactiveRoleFunnel">
                            Funnel to Teammates
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="inactiveRoleFeed">
                            Feed Human Station
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="inactiveRoleBlock">
                            Blocking
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="inactiveRoleRefill">
                            Refilling Hopper
                        </label>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Transition Phase Role</label>
                    <input type="text" id="teleopTransitionRole">
                </div>
                
                <div class="form-group">
                    <div class="counter">
                        <span class="counter-label">Fouls</span>
                        <button class="counter-btn" onclick="decrement('teleopFouls')">-</button>
                        <span class="counter-value" id="teleopFouls">0</span>
                        <button class="counter-btn" onclick="increment('teleopFouls')">+</button>
                    </div>
                </div>
                
                <div class="form-group">
                    <div class="counter">
                        <span class="counter-label">Cycles</span>
                        <button class="counter-btn" onclick="decrement('teleopCycles')">-</button>
                        <span class="counter-value" id="teleopCycles">0</span>
                        <button class="counter-btn" onclick="increment('teleopCycles')">+</button>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Collaboration (1-10)</label>
                    <input type="number" id="teleopCollaboration" min="1" max="10">
                </div>
                
                <div class="form-group">
                    <label>Notes</label>
                    <textarea id="teleopNotes"></textarea>
                </div>
            </div>
        </div>
        
        <!-- Endgame -->
        <div id="endgame" class="tab-content">
            <div class="section">
                <h2>Endgame</h2>
                
                <div class="form-group">
                    <label>Climb Level</label>
                    <select id="endgameClimbLevel">
                        <option value="None">None</option>
                        <option value="Level 1">Level 1</option>
                        <option value="Level 2">Level 2</option>
                        <option value="Level 3">Level 3</option>
                        <option value="Failed">Failed</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Climb Speed</label>
                    <select id="endgameClimbSpeed">
                        <option value="N/A">N/A</option>
                        <option value="Slow">Slow</option>
                        <option value="Medium">Medium</option>
                        <option value="Fast">Fast</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <div class="counter">
                        <span class="counter-label">Fuel Scored</span>
                        <button class="counter-btn" onclick="decrement5('endgameFuelScored')">-5</button>
                        <button class="counter-btn" onclick="decrement('endgameFuelScored')">-</button>
                        <span class="counter-value" id="endgameFuelScored">0</span>
                        <button class="counter-btn" onclick="increment('endgameFuelScored')">+</button>
                        <button class="counter-btn" onclick="increment5('endgameFuelScored')">+5</button>
                    </div>
                </div>
                <div class="form-group">
                    <div class="counter">
                        <span class="counter-label">Fuel Missed</span>
                        <button class="counter-btn" onclick="decrement5('endgameFuelMissed')">-5</button>
                        <button class="counter-btn" onclick="decrement('endgameFuelMissed')">-</button>
                        <span class="counter-value" id="endgameFuelMissed">0</span>
                        <button class="counter-btn" onclick="increment('endgameFuelMissed')">+</button>
                        <button class="counter-btn" onclick="increment5('endgameFuelMissed')">+5</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>Disconnect?</label>
                    <div class="checkbox-group">
                        <label class="checkbox-label">
                            <input type="radio" name = "disconnect" id="disconnectYes" value="yes">
                            Yes
                        </label>
                        <label class="checkbox-label">
                            <input type="radio" name = "disconnect" id="disconnectNo" value="no">
                            No
                        </label>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Notes</label>
                    <textarea id="endgameNotes"></textarea>
                </div>
                
                <div class="form-group">
                    <label>Extra Notes</label>
                    <textarea id="extraNotes"></textarea>
                </div>
            </div>
        </div>
        
        <!-- Action Buttons -->
        <div class="buttons">
            <button onclick="resetForm()">Reset</button>
            <button onclick="saveMatch()">Save Match</button>
        </div>
    </div>
    
    <!-- History Tab -->
    <div id="history" class="tab-content">
        <div class="section">
            <h2>Match History</h2>
            <p style="margin-bottom: 20px;">Saved matches: <strong id="historyCount">0</strong></p>
            
            <div class="buttons" style="margin-bottom: 20px;">
                <button onclick="exportAllCSV()">Export All Matches (CSV)</button>
                <button onclick="clearHistory()">Clear All History</button>
            </div>
            
            <div id="historyList"></div>
        </div>
    </div>
    
    <!-- QR Modal -->
    <div id="qrModal" class="modal">
        <div class="modal-content">
            <h2>Match Data QR Code</h2>
            <div id="qrcode" style="text-align: center; margin: 20px 0;"></div>
            <p style="font-size: 12px; margin-bottom: 10px;">Scan this QR code to get the CSV data row</p>
            <button onclick="closeQRModal()">Close</button>
        </div>
    </div>
    
    <!-- Data Preview Modal -->
    <div id="previewModal" class="modal">
        <div class="modal-content">
            <h2>Data Preview</h2>
            <div id="previewContent"></div>
            <button onclick="closePreviewModal()" style="margin-top: 10px;">Close</button>
        </div>
    </div>
    
    <script>        
        function switchMainTab(tabName) {
            const tabs = document.querySelectorAll('.tabs > .tab');
            const contents = document.querySelectorAll('body > .tab-content');
            
            tabs.forEach(tab => tab.classList.remove('active'));
            contents.forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tabName).classList.add('active');
            
            if (tabName === 'history') {
                updateHistoryDisplay();
            }
        }
        
        function switchTab(tabName) {
            const tabs = document.querySelectorAll('#scouting .tabs .tab');
            const contents = document.querySelectorAll('#scouting .tab-content');
            
            tabs.forEach(tab => tab.classList.remove('active'));
            contents.forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tabName).classList.add('active');
        }

        function increment(buttonID){ 
            const value = document.getElementById(buttonID);
            value.textContent = parseInt(value.textContent) + 1;        
        }  

        function decrement(buttonID){ 
            const value = document.getElementById(buttonID);

            if(value.textContent > 0){
                value.textContent = parseInt(value.textContent) - 1; 
            }
        }

        function increment5(buttonID) {
            const value = document.getElementById(buttonID);
            value.textContent = parseInt(value.textContent) + 5;
        }

        function decrement5(buttonID) {
            const value = document.getElementById(buttonID);

            if(value.textContent - 5 >= 0) {
                value.textContent = parseInt(value.textContent) -5;
            }
            else{
                value.textContent = parseInt('0');
            }
        }

        // const APP = { 
        //     data: [],
        //     init() {
        //         APP.addListeners()
        //     }
        //     addListeners() {
        //         const form = document.querySelector();
        //         form.addEventListener();
        //     }
        // }

        function saveMatch(){

        }

        function resetForm(){
            
            // Reset all +- buttons
            const arrayOfButtons = [];

            arrayOfButtons[0] = document.getElementById('endgameFuelScored');
            arrayOfButtons[1] = document.getElementById('endgameFuelMissed');
            arrayOfButtons[2] = document.getElementById('teleopFuelMissed');
            arrayOfButtons[3] = document.getElementById('teleopFuelScored');
            arrayOfButtons[4] = document.getElementById('autoFuelMissed');
            arrayOfButtons[5] = document.getElementById('autoFuelScored');
            arrayOfButtons[6] = document.getElementById('teleopFouls');
            arrayOfButtons[7] = document.getElementById('teleopCycles');

            for(let i = 0; i < arrayOfButtons.length; i++){
                arrayOfButtons[i].textContent = '0';
            }

            // Reset all checkboxes
            const allCheckboxes = document.querySelectorAll('input[type="checkbox"]');
    
            allCheckboxes.forEach(checkbox => {
                checkbox.checked = false;
            })

            // Reset all text fields
            const allText = document.querySelectorAll('input[type="text"], input[type="number"], textarea');
    
            allText.forEach(text => {
                text.value = '';
            })

            // Reset all drop down menu's
            var allDropdowns = document.getElementsByTagName('select');
            
            for (var i = 0; i < allDropdowns.length; i++){
                allDropdowns[i].selectedIndex = 0;
            }            
        }

        function collectData(){

            const data = {
                timestamp: new Date().toISOString(),

                // Match info
                matchNumber: document.getElementById('matchNumber').value,
                teamNumber: document.getElementById('teamNumber').value,
                scoutName: document.getElementById('scoutName').value,

                pit: {
                    climbLevel: document.getElementById('pitClimbLevel').value,
                    heightInches: document.getElementById('pitHeight').value,
                    weightLbs: document.getElementById('pitWeight').value,
                    intakeType: document.getElementById('pitIntake').value,
                    driveMechanism: document.getElementById('pitDriveMechanism').value,
                    strategy: document.getElementById('pitStrategy').value,

                    features: {
                        vision: document.getElementById('pitVision').checked,
                        adjustableScoring: document.getElementById('pitAdjustable').checked
                    },

                    hopperCapacity: document.getElementById('pitHopperCapacity').value,
                    driveExperience: document.getElementById('pitDriveExperience').value,
                    estimatedCycles: document.getElementById('pitEstimatedCycles').value,
                    conversionPercent: document.getElementById('pitConversionPercent').value,
                    launchRate: document.getElementById('pitLaunchRate').value,
                    buildQuality: document.getElementById('pitDurability').value,
                    outsidePerimeter: document.getElementById('pitOutsidePerimeter').value,
                    breakdowns: document.getElementById('pitBreakdowns').value,
                    humanPlayerNotes: document.getElementById('pitHumanPlayer').value,
                    notes: document.getElementById('pitNotes').value
                },

                auto: {
                    climbLevel: document.getElementById('autoClimbLevel').value,
                    climbSpeed: document.getElementById('autoClimbSpeed').value,

                    fuelScored: parseInt(document.getElementById('autoFuelScored').textContent),
                    fuelMissed: parseInt(document.getElementById('autoFuelMissed').textContent),

                    ballsCollectedToOurSide: document.getElementById('autoBallsCollected').checked,
                    notes: document.getElementById('autoNotes').value
                },

                teleop: {
                    fuelScored: parseInt(document.getElementById('teleopFuelScored').textContent),
                    fuelMissed: parseInt(document.getElementById('teleopFuelMissed').textContent),

                    traversalTimeSec: document.getElementById('teleopTraversalTime').value,

                    activeRole: {
                        funnel: document.getElementById('activeRoleFunnel').checked,
                        scoring: document.getElementById('activeRoleScoring').checked,
                        feedHumanStation: document.getElementById('activeRoleFeed').checked
                    },

                    inactiveRole: {
                        limitingBalls: document.getElementById('inactiveRoleLimit').checked,
                        funnel: document.getElementById('inactiveRoleFunnel').checked,
                        feedHumanStation: document.getElementById('inactiveRoleFeed').checked,
                        blocking: document.getElementById('inactiveRoleBlock').checked,
                        refillHopper: document.getElementById('inactiveRoleRefill').checked
                    },

                    transitionRole: document.getElementById('teleopTransitionRole').value,

                    fouls: parseInt(document.getElementById('teleopFouls').textContent),
                    cycles: parseInt(document.getElementById('teleopCycles').textContent),

                    collaborationScore: document.getElementById('teleopCollaboration').value,
                    notes: document.getElementById('teleopNotes').value
                },

                endgame: {
                    climbLevel: document.getElementById('endgameClimbLevel').value,
                    climbSpeed: document.getElementById('endgameClimbSpeed').value,

                    fuelScored: parseInt(document.getElementById('endgameFuelScored').textContent),
                    fuelMissed: parseInt(document.getElementById('endgameFuelMissed').textContent),

                    notes: document.getElementById('endgameNotes').value,
                    extraNotes: document.getElementById('extraNotes').value
                }
            }
        }

        function exportAllCSV(){

        }

        function clearHistory(){

        }

    </script>
</body>
</html>
