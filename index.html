<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FRC 7476 Scouting</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
    <h1>FRC 7476 Spongebotics Scouting</h1> 
    
    <div id = "mainTabs">

        <!-- Main Interface -->
        <div id="mainInterface">
            <!-- Match Info -->
            <div class="section">
                <div class="form-group">
                    <label>Match #</label>
                    <input type="number" id="matchNumber" min="1">
                </div>
                <div class="form-group">
                    <label>Team #</label>
                    <input type="number" id="teamNumber" min="1">
                </div>
                <div class="form-group">
                    <label>Scout #</label>
                    <input type="number" id="scoutNumber" min="1">
                </div>
                <div class="form-group">
                    <label>Alliance</label>
                    <select id="alliance">
                        <option value="">Select...</option>
                        <option value="Red 1">Red 1</option>
                        <option value="Red 2">Red 2</option>
                        <option value="Red 3">Red 3</option>
                        <option value="Blue 1">Blue 1</option>
                        <option value="Blue 2">Blue 2</option>
                        <option value="Blue 3">Blue 3</option>
                    </select>
                </div>
            </div>
            
            <!-- Tabs -->
            <div class="tabs">
                <button class="tab active" onclick="switchTab('pit')">Pit</button>
                <button class="tab" onclick="switchTab('auto')">Auto</button>
                <button class="tab" onclick="switchTab('teleop')">Teleop</button>
                <button class="tab" onclick="switchTab('endgame')">Endgame</button>
            </div>
            
            <!-- Pit Scouting -->
            <div id="pit" class="tab-content active">
                <div class="section">
                    <h2>Pit Scouting</h2>
                    
                    <div class="form-group">
                        <label>Climb Level</label>
                        <div class="checkbox-group">
                            <label class="checkbox-label">
                                <input type="checkbox" id="lvl1">
                                Level 1
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" id="lvl2">
                                Level 2
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" id="lvl3">
                                Level 3
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" id="none">
                                None
                            </label>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>Height (inches)</label>
                        <input type="number" id="pitHeight" step="0.1">
                    </div>
                    
                    <div class="form-group">
                        <label>Weight (lbs)</label>
                        <input type="number" id="pitWeight" step="0.1">
                    </div>
                    
                    <div class="form-group">
                        <label>Intake Type</label>
                        <div class="checkbox-group">
                            <label class="checkbox-label">
                                <input type="checkbox" id="otbIntake">
                                Over the Bumper
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" id="inFrameIntake">
                                In perimeter
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" id="intakeFromStation">
                                Passive Intake - from station
                            </label>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>Drive Mechanism</label>
                        <select id="pitDriveMechanism">
                            <option value="">Select...</option>
                            <option value="Tank">Tank</option>
                            <option value="Swerve">Swerve</option>
                            <option value="Mecanum">Mecanum</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label>Strategy</label>
                        <textarea id="pitStrategy"></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label>Features</label>
                        <div class="checkbox-group">
                            <label class="checkbox-label">
                                <input type="checkbox" id="pitVision">
                                Vision
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" id="pitAdjustable">
                                Adjustable Launcher for Scoring
                            </label>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>Hopper Capacity</label>
                        <select id="pitHopperCapacity">
                            <option value="">Select...</option>
                            <option value="Fixed">Fixed</option>
                            <option value="Extendable Horizontally">Extendable Horizontally</option>
                            <option value ="Extendable Vertically">Extendable Vertically</option>
                            <option value="None">None</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label>Drive Experience</label>
                        <select id="pitDriveExperience">
                            <option value="">Select...</option>
                            <option value="Rookie">Rookie</option>
                            <option value="Intermediate">Intermediate</option>
                            <option value="Advanced">Advanced</option>
                            <option value="Expert">Expert</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label>Estimated Cycles</label>
                        <input type="number" id="pitEstimatedCycles" min="0">
                    </div>
                    
                    <div class="form-group">
                        <label>Conversion %</label>
                        <input type="number" id="pitConversionPercent" min="0" max="100">
                    </div>
                    
                    <div class="form-group">
                        <label>Launch Rate (fuel/sec)</label>
                        <input type="number" id="pitLaunchRate" step="0.1">
                    </div>
                    
                    <div class="form-group">
                        <label>Build Quality (1-10)</label>
                        <input type="number" id="pitDurability" min="1" max="10">
                    </div>
                    
                    <div class="form-group">
                        <label>Outside Perimeter</label>
                        <textarea id="pitOutsidePerimeter"></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label>Breakdowns</label>
                        <textarea id="pitBreakdowns"></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label>Human Player Notes</label>
                        <textarea id="pitHumanPlayer"></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label>Notes</label>
                        <textarea id="pitNotes"></textarea>
                    </div>
                </div>
            </div>
            
            <!-- Auto -->
            <div id="auto" class="tab-content">
                <div class="section">
                    <h2>Auto</h2>
                    
                    <div class="form-group">
                        <label>Climb Level</label>
                        <select id="autoClimbLevel">
                            <option value="None">None</option>
                            <option value="Level 1">Level 1</option>
                            <option value="Level 2">Level 2</option>
                            <option value="Level 3">Level 3</option>
                            <option value="Failed">Failed</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label>Climb Speed</label>
                        <select id="autoClimbSpeed">
                            <option value="N/A">N/A</option>
                            <option value="Slow">Slow</option>
                            <option value="Medium">Medium</option>
                            <option value="Fast">Fast</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <div class="counter">
                            <span class="counter-label">Fuel Scored</span>
                            <button class="counter-btn" onclick="decrement('autoFuelScored')">-</button>
                            <span class="counter-value" id="autoFuelScored">0</span>
                            <button class="counter-btn" onclick="increment('autoFuelScored')">+</button>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="autoBallsCollected">
                            Balls Collected to Our Side
                        </label>
                    </div>
                    
                    <div class="form-group">
                        <label>Notes</label>
                        <textarea id="autoNotes"></textarea>
                    </div>
                </div>
            </div>
            
            <!-- Teleop -->
            <div id="teleop" class="tab-content">
                <div class="section">
                    <h2>Teleop</h2>
                    
                    <div class="form-group">
                        <div class="counter">
                            <span class="counter-label">Fuel Scored</span>
                            <button class="counter-btn" onclick="decrement('teleopFuelScored')">-</button>
                            <span class="counter-value" id="teleopFuelScored">0</span>
                            <button class="counter-btn" onclick="increment('teleopFuelScored')">+</button>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <div class="counter">
                            <span class="counter-label">Fuel Missed</span>
                            <button class="counter-btn" onclick="decrement('teleopFuelMissed')">-</button>
                            <span class="counter-value" id="teleopFuelMissed">0</span>
                            <button class="counter-btn" onclick="increment('teleopFuelMissed')">+</button>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>Traversal Time (sec)</label>
                        <input type="number" id="teleopTraversalTime" step="0.1">
                    </div>
                    
                    <div class="form-group">
                        <label>Active Phase Role</label>
                        <div class="checkbox-group">
                            <label class="checkbox-label">
                                <input type="checkbox" id="activeRoleFunnel">
                                Funnel to Teammates
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" id="activeRoleScoring">
                                Scoring
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" id="activeRoleFeed">
                                Feed Human Station
                            </label>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>Inactive Phase Role</label>
                        <div class="checkbox-group">
                            <label class="checkbox-label">
                                <input type="checkbox" id="inactiveRoleLimit">
                                Limiting Balls
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" id="inactiveRoleFunnel">
                                Funnel to Teammates
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" id="inactiveRoleFeed">
                                Feed Human Station
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" id="inactiveRoleBlock">
                                Blocking
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" id="inactiveRoleRefill">
                                Refilling Hopper
                            </label>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>Transition Phase Role</label>
                        <input type="text" id="teleopTransitionRole">
                    </div>
                    
                    <div class="form-group">
                        <div class="counter">
                            <span class="counter-label">Fouls</span>
                            <button class="counter-btn" onclick="decrement('teleopFouls')">-</button>
                            <span class="counter-value" id="teleopFouls">0</span>
                            <button class="counter-btn" onclick="increment('teleopFouls')">+</button>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <div class="counter">
                            <span class="counter-label">Cycles</span>
                            <button class="counter-btn" onclick="decrement('teleopCycles')">-</button>
                            <span class="counter-value" id="teleopCycles">0</span>
                            <button class="counter-btn" onclick="increment('teleopCycles')">+</button>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>Collaboration (1-10)</label>
                        <input type="number" id="teleopCollaboration" min="1" max="10">
                    </div>
                    
                    <div class="form-group">
                        <label>Notes</label>
                        <textarea id="teleopNotes"></textarea>
                    </div>
                </div>
            </div>
            
            <!-- Endgame -->
            <div id="endgame" class="tab-content">
                <div class="section">
                    <h2>Endgame</h2>
                    
                    <div class="form-group">
                        <label>Climb Level</label>
                        <select id="endgameClimbLevel">
                            <option value="None">None</option>
                            <option value="Level 1">Level 1</option>
                            <option value="Level 2">Level 2</option>
                            <option value="Level 3">Level 3</option>
                            <option value="Failed">Failed</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label>Climb Speed</label>
                        <select id="endgameClimbSpeed">
                            <option value="N/A">N/A</option>
                            <option value="Slow">Slow</option>
                            <option value="Medium">Medium</option>
                            <option value="Fast">Fast</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <div class="counter">
                            <span class="counter-label">Fuel Scored</span>
                            <button class="counter-btn" onclick="decrement('endgameFuelScored')">-</button>
                            <span class="counter-value" id="endgameFuelScored">0</span>
                            <button class="counter-btn" onclick="increment('endgameFuelScored')">+</button>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>Notes</label>
                        <textarea id="endgameNotes"></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label>Extra Notes</label>
                        <textarea id="extraNotes"></textarea>
                    </div>
                </div>
            </div>
            
            <!-- Action Buttons -->
            <div class="buttons">
                <button onclick="resetForm()">Reset</button>
                <button onclick="generateQR()">QR Code</button>
            </div>
        </div>
        
        <!-- QR Modal -->
        <div id="qrModal" class="modal">
            <div class="modal-content">
                <h2>QR Code</h2>
                <div id="qrcode"></div>
                <button onclick="closeQRModal()">Close</button>
            </div>
        </div>
    </div>
    
<script>
 function switchTab(tabId) {
    // 1) Hide all tab content panels
    const panels = document.querySelectorAll('.tab-content');
    panels.forEach(panel => panel.classList.remove('active'));

    // 2) Remove active class from all tab buttons
    const tabs = document.querySelectorAll('.tabs .tab');
    tabs.forEach(tab => tab.classList.remove('active'));

    // 3) Show the selected panel
    const activePanel = document.getElementById(tabId);
    if (activePanel) {
      activePanel.classList.add('active');
    }

    // 4) Activate the clicked tab button (match by onclick attribute)
    // This works with your current HTML (onclick="switchTab('pit')")
    const activeTabButton = document.querySelector(`.tabs .tab[onclick="switchTab('${tabId}')"]`);
    if (activeTabButton) {
      activeTabButton.classList.add('active');
    }
  }

   window.resetForm = function () {
    // 1) Clear all inputs/selects/textareas
    document.querySelectorAll('#mainInterface input, #mainInterface select, #mainInterface textarea')
      .forEach(el => {
        const tag = el.tagName.toLowerCase();
        const type = (el.getAttribute('type') || '').toLowerCase();

        if (tag === 'input') {
          if (type === 'checkbox' || type === 'radio') {
            el.checked = false;
          } else {
            el.value = '';
          }
        } else if (tag === 'select') {
          el.selectedIndex = 0;
        } else if (tag === 'textarea') {
          el.value = '';
        }
      });

    // 2) Reset all counter spans back to 0
    document.querySelectorAll('#mainInterface .counter-value').forEach(span => {
      span.textContent = '0';
    });

    // 3) Close QR modal + clear QR output (optional but usually desired)
    const modal = document.getElementById('qrModal');
    if (modal) modal.classList.remove('active');

    const qr = document.getElementById('qrcode');
    if (qr) qr.innerHTML = '';

    // 4) Return to Pit tab (optional)
    if (typeof switchTab === 'function') switchTab('pit');
  };
</script>

</body>
</html>
